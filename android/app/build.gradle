plugins {
    id 'com.android.application'
}

// google-services.json chứa config Firebase của từng project nên không commit.
// Chỉ apply plugin khi có file, để app vẫn build được khi chưa setup Firebase
// (lúc đó FCM không hoạt động, các màn hình khác vẫn chạy bình thường).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("app/google-services.json not found: building without Firebase (FCM disabled)")
}

android {
    namespace 'com.example.andemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.andemo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Đổi backend lúc build, ví dụ trỏ vào mock server (tools/MockPdaAlertServer.java):
        //   ./gradlew assembleDebug -PapiBaseUrl=http://10.0.2.2:8081/
        buildConfigField "String", "API_BASE_URL",
                "\"${project.findProperty('apiBaseUrl') ?: 'https://andemo.onrender.com/'}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Retrofit + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // QR Code scan (ZXing)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Location (Google Play Services)
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'

    // Image loading (Product image)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
