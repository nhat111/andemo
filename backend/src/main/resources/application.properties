spring.application.name=andemo-backend

# Mặc định: H2 trong RAM (restart là mất dữ liệu). Deploy thật thì đặt biến môi trường:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/<db>
#   SPRING_DATASOURCE_USERNAME=...  SPRING_DATASOURCE_PASSWORD=...
# Driver và dialect được Spring/Hibernate tự nhận theo URL.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

jwt.secret=andemo-super-secret-key-change-me-in-prod-32chars
# Access token ngắn hạn (1 giờ). Hết hạn thì client dùng refresh token để lấy token mới.
jwt.expiration=3600000
# Refresh token xoay vòng: thiết bị không liên lạc với server quá số ngày này thì phải login lại
jwt.refresh-expiration-days=30

server.port=8080
