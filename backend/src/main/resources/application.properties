spring.application.name=andemo-backend

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

jwt.secret=andemo-super-secret-key-change-me-in-prod-32chars
jwt.expiration=86400000

server.port=8080

# Menu lock (khóa menu bằng mật khẩu 4 số)
app.menu-lock.max-fail=5
# Demo: OTP luôn là 123456 (chưa tích hợp SMS)
app.otp.demo-mode=true
app.otp.ttl-seconds=180
