spring.application.name=andemo-backend

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

jwt.secret=andemo-super-secret-key-change-me-in-prod-32chars
# Access token ngắn hạn (1 giờ). Hết hạn thì client dùng refresh token để lấy token mới.
jwt.expiration=3600000
# Refresh token xoay vòng: thiết bị không liên lạc với server quá số ngày này thì phải login lại
jwt.refresh-expiration-days=30

server.port=8080
