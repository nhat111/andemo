# Blueprint for Render.com
# Deploy: Connect repo → Render will detect this file

services:
  - type: web
    name: andemo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx384m -XX:+UseContainerSupport"
    healthCheckPath: /api/auth/login
